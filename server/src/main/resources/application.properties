# Cloud Run sets PORT; locally the server listens on 8090 on every interface.
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8090}

# Managed Agents ids come from anthropic/claude-lock.json after `ant apply`.
# Set them as env vars: MEALPAL_AGENT_PLANNER_ID, MEALPAL_AGENT_ENVIRONMENT_ID,
# and MEALPAL_AGENT_PRICE_BOOK_ID once the price book exists.
# Spend cap per plan session, US cents at list price.
mealpal.agent.session-budget-cents=100

# The key the app sends in X-MealPal-Key. Set MEALPAL_API_APP_KEY in
# production (Secret Manager); unset locally means no check.
%test.mealpal.api.app-key=test-key
