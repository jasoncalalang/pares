# The phone reaches xeon over the home network, so listen on every interface.
quarkus.http.host=0.0.0.0
quarkus.http.port=8090

# Managed Agents ids come from anthropic/claude-lock.json after `ant apply`.
# Set them as env vars rather than here:
#   MEALPAL_AGENT_PLANNER_ID, MEALPAL_AGENT_ENVIRONMENT_ID, MEALPAL_AGENT_PRICE_BOOK_ID
# Spend cap per plan session, US cents at list price.
mealpal.agent.session-budget-cents=100
