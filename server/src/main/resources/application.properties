# Cloud Run sets PORT; locally the server listens on 8090 on every interface.
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8090}

# Managed Agents ids come from anthropic/claude-lock.json after `ant apply`.
# Set them as env vars: MEALPAL_AGENT_PLANNER_ID, MEALPAL_AGENT_ENVIRONMENT_ID,
# and MEALPAL_AGENT_PRICE_BOOK_ID once the price book exists.
# Spend cap per plan session, US cents at list price.
mealpal.agent.session-budget-cents=100

# The key the app sends in X-MealPal-Key. Set MEALPAL_API_APP_KEY in
# production (Secret Manager); unset locally means no check.
%test.mealpal.api.app-key=test-key

# The API contract. server/openapi.json is the checked-in copy, and
# OpenApiContractTest fails when it and the served document differ.
# Production does not serve it (the app key guards /v1, not /q).
quarkus.smallrye-openapi.info-title=MealPal API
quarkus.smallrye-openapi.info-version=1
%prod.quarkus.smallrye-openapi.enabled=false

# What the server accepts from the price checker (PriceIntake). PriceCheckerFilesTest holds
# these to anthropic/agents/price-checker.md and its sandbox: the same stores, and only
# the sites the agent can reach.
mealpal.prices.stores=palengke,sari-sari,sm-supermarket,savemore,puregold,robinsons-supermarket,waltermart,landers,s-and-r,metromart,pushkart
mealpal.prices.source-hosts=da.gov.ph,psa.gov.ph,dti.gov.ph,pna.gov.ph,lazada.com.ph,smmarkets.ph,puregold.com.ph,robinsonssupermarket.com.ph,landers.ph,snrshopping.com,metromart.com,waltermartdelivery.com.ph,pushkart.ph
